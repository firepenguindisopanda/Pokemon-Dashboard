# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy configuration lives here so it is reviewable and reproducible instead
# of existing only as dashboard state.
#
# IMPORTANT: adding this file does NOT retroactively reconfigure a service that
# was created through the dashboard. Either adopt it as a Blueprint, or mirror
# the settings below by hand. The build command is the part that must not be
# missed — see the note on it.

services:
  - type: web
    name: pokemon-dashboard
    runtime: python
    plan: free
    branch: pokedex-app

    # `flask db upgrade` MUST run before the app serves traffic: application
    # startup no longer creates tables (that was an unguarded race across
    # workers), so without this a deploy comes up against an empty schema.
    #
    # `flask train` builds the ML models into this instance's disk (~30s).
    # Artifacts are not committed: the cache key is a hash of the seeded data,
    # so a repo-committed model only loads if the target database happens to
    # hash identically — which it does not. Training here means the cache
    # always matches the data actually being served.
    #
    # It is tolerated to fail: on a brand-new database the schema exists but
    # has not been seeded yet, and there is nothing to train on. The first
    # request needing analytics then trains lazily (mutex-guarded).
    #
    # `flask init` deliberately does NOT run here — it replaces seed data and
    # would wipe real trainers on every deploy. Run it once, by hand.
    #
    # preDeployCommand would be the better home for the migration, but it
    # requires a paid instance type.
    buildCommand: "pip install -r requirements.txt && flask db upgrade && (flask train || echo 'training deferred to first request')"

    # T24 (chat). The default sync worker had to change — but NOT to eventlet,
    # which is what this file used to say.
    #
    # CORRECTION, measured after a real deploy came up on the default command:
    # the sync worker *does* accept a WebSocket. An earlier version of this
    # comment claimed it could not, and that was wrong. The real failure is
    # worse because it is silent — the sync worker serves one connection at a
    # time, so a single held socket starves everything else:
    #     1 socket held  ->  GET /app timed out after 8s
    #                    ->  a 2nd websocket was refused
    # One person opening /chat takes the whole site down, with nothing at
    # connect time to explain why.
    #
    # eventlet 0.41.1 still runs on 3.12, but it now emits an official
    # deprecation warning telling you not to use it for new projects, and both
    # eventlet and gevent need `monkey_patch()` before any other import. Once
    # patched, psycopg2 blocks the whole worker unless psycogreen is added too:
    # measured against live Neon, a 2s query let a 100ms ticker fire once
    # instead of 25 times. One slow query would stall every HTTP request and
    # every WebSocket heartbeat on this single instance.
    #
    # gthread gives each connection its own thread and needs no patching at
    # all, so every existing route keeps the exact code path it has today.
    # Flask-SocketIO runs in async_mode="threading" and serves real WebSockets
    # through simple-websocket. The trade is scale: threads, so tens of
    # concurrent sockets rather than thousands. Far above this app's traffic.
    #
    # --threads is the ceiling on concurrent chat users, and it is not a
    # comfort setting. A held WebSocket occupies its thread for the whole
    # connection, so usable sockets ~= threads minus in-flight HTTP.
    #
    # Measured against this exact command on a seeded database:
    #   --threads 8   8 sockets starve the worker completely — GET /app times
    #                 out after 10s and a 9th socket cannot connect at all
    #   --threads 64  40 sockets held open, GET /app still 200 in ~40ms,
    #                 worker RSS 222MB -> 226MB
    #
    # Thread stacks are virtual, so the memory cost of the higher number is
    # about 4MB, not 8MB per thread. 64 is chosen for headroom on Render's
    # 512MB free tier, where ~222MB of the baseline is the ML model set.
    #
    # If concurrent users ever approach ~50, this design is the wrong one and
    # the answer is a greenlet worker, not a bigger number here.
    #
    # ── WHY ONE WORKER, even though T27 added a Redis message queue ──
    #
    # The queue makes cross-worker broadcasting *correct* — measured: with two
    # workers and no queue only 4 of 6 clients received a broadcast; with the
    # queue, 6 of 6. It is configured and ready. Two things still argue for a
    # single worker here:
    #
    #   MEMORY   two workers measured 468MB against this plan's 512MB limit
    #            (222MB each, mostly the ML model set, plus a 25MB master).
    #            91% utilisation with no headroom for a request spike.
    #
    #   STICKY   Socket.IO needs sticky sessions for >1 worker, and a message
    #            queue does NOT provide them. Engine.IO sessions live in one
    #            worker's memory, so the polling handshake and its follow-up
    #            polls must reach the same process. Measured with 2 workers and
    #            the queue enabled: a browser flapped continuously, every
    #            polling request returning "400 BAD REQUEST" (session ID
    #            unknown). Render's free tier offers no sticky routing.
    #
    # So: keep -w 1 here. Scaling up needs a paid instance for the memory AND
    # either sticky sessions or a websocket-only transport policy on the client
    # (which forgoes the polling fallback). The queue means that scaling is a
    # config change rather than a rewrite.
    #
    # Still `wsgi:app` — Socket.IO installs WSGI middleware on app.wsgi_app
    # rather than a URL rule, so there is no separate entry point to target.
    startCommand: "gunicorn --worker-class gthread --threads 64 --timeout 120 wsgi:app"

    # `/` is the login page and requires no authentication.
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"

      # ── Secrets — set in the dashboard, never committed ──
      # sync: false means "Render prompts for this; it is not stored in git".
      # With DEBUG=false the app refuses to start unless both secrets are at
      # least 32 characters and are not placeholders. That check also runs
      # during the build, so a weak secret fails the deploy rather than
      # shipping an unprotected app.
      - key: FLASK_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Native rediss:// URL, NOT the Upstash REST URL/token.
      # Required with DEBUG=false; sessions must not fall back to cookies.
      #
      # Since T27 this also backs the Socket.IO message queue, on the channel
      # `pokemon-dashboard:socketio`. The namespace is not cosmetic: this
      # Upstash instance is shared with another application (104 of its 105
      # keys are not ours) and python-socketio's default channel is the
      # generic "socketio".
      - key: REDIS_URL
        sync: false

      # ── Core ──
      - key: DEBUG
        value: "false"

      # ── JWT ──
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: JWT_COOKIE_CSRF_PROTECT
        value: "true"
      - key: JWT_ACCESS_TOKEN_EXPIRES_HOURS
        value: "0.25"
      - key: JWT_REFRESH_TOKEN_EXPIRES_DAYS
        value: "7"
      - key: JWT_TOKEN_LEEWAY_SECONDS
        value: "30"

      # ── Rate limiting ──
      # Counters live in Redis so limits survive restarts and span workers.
      - key: RATE_LIMIT_AUTH
        value: "20 per minute"
      - key: RATE_LIMIT_ENABLED
        value: "true"

      # ── CORS ──
      # Must NOT be "*": auth rides in cookies, and the app refuses to start
      # with a wildcard when DEBUG=false. Set this to the service's own URL.
      - key: CORS_ORIGINS
        sync: false

      # ── Database pooling ──
      # pool_pre_ping is what survives Neon closing idle connections.
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "10"
      - key: DATABASE_POOL_PRE_PING
        value: "true"

      # ── Analytics / ML ──
      - key: ANALYTICS_AUTO_INITIALIZE
        value: "true"
      - key: RANDOM_SEED
        value: "42"
